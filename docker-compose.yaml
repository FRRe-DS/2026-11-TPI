services:
  # 1. Módulo 1 - Identidad y Acceso (Keycloak local para pruebas)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: m1_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASSWORD:?Falta definir KC_PASSWORD en el archivo .env}
    ports:
      - "8080:8080"
    volumes:
      - ./realm-config:/opt/keycloak/data/import
    command: 
      - start-dev
      - --import-realm

  # 2. Aplicación Backend (FastAPI)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: m7_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      # Los tokens se piden desde el host, así que el "iss" es localhost;
      # las claves públicas se descargan por la red interna de Docker.
      - KEYCLOAK_ISSUER_URI=http://localhost:8080/realms/ds-2026-realm
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/ds-2026-realm/protocol/openid-connect/certs
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - PASARELA_WEBHOOK_SECRET=${PASARELA_WEBHOOK_SECRET:-}
      - M4_UBICACION_URL=${M4_UBICACION_URL:-}
      - M6_VIAJES_URL=${M6_VIAJES_URL:-}
      - M9_RESERVAS_URL=${M9_RESERVAS_URL:-}
    depends_on:
      - keycloak