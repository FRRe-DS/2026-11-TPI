services:
  # 1. Módulo 1 - Identidad y Acceso (Keycloak local para pruebas)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: m1_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASSWORD:?Falta definir KC_PASSWORD en el archivo .env}
    ports:
      - "8080:8080"
    volumes:
      - ./realm-config:/opt/keycloak/data/import
    command: 
      - start-dev
      - --import-realm

  # 2. Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: mysql_m7_pagos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-m7}
      MYSQL_USER: ${MYSQL_USER:-m7}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Aplicación Backend (FastAPI)
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: m7_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-m7}
      MYSQL_USER: ${MYSQL_USER:-m7}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-m7}:${MYSQL_PASSWORD:-admin}@db:3306/${MYSQL_DATABASE:-m7}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ds-2026-realm
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      M4_UBICACION_URL: ${M4_UBICACION_URL:-}
      M6_VIAJES_URL: ${M6_VIAJES_URL:-}
      M9_RESERVAS_URL: ${M9_RESERVAS_URL:-}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  db_data: