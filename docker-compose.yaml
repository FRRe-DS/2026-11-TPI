services:
  # 1. Módulo 1 - Identidad y Acceso (Keycloak local para pruebas)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: m1_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASSWORD:?Falta definir KC_PASSWORD en el archivo .env}
    ports:
      - "8080:8080"
    volumes:
      - ./realm-config:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm

  # 2. Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: mysql_m7_pagos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-m7}
      MYSQL_USER: ${MYSQL_USER:-m7}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-admin}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Aplicación Backend (FastAPI)
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: m7_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-m7}
      MYSQL_USER: ${MYSQL_USER:-m7}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-m7}:${MYSQL_PASSWORD:-admin}@db:3306/${MYSQL_DATABASE:-m7}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ds-2026-realm
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      M4_UBICACION_URL: ${M4_UBICACION_URL:-}
      M6_VIAJES_URL: ${M6_VIAJES_URL:-}
      M9_RESERVAS_URL: ${M9_RESERVAS_URL:-}
      PASARELA_URL: ${PASARELA_URL:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-m7}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-m7}
      RABBITMQ_VHOST: /
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-transporte}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: m7_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-m7}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-m7}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: m7_rabbitmq_worker
    restart: unless-stopped
    command: ["python", "-m", "worker"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-m7}
      MYSQL_USER: ${MYSQL_USER:-m7}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-m7}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-m7}
      RABBITMQ_VHOST: /
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-transporte}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  db_data:
  rabbitmq_data:
