version: '3.8'

services:
  # 1. Módulo 1 - Identidad y Acceso (Keycloak local para pruebas)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: m1_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASSWORD:?Falta definir KC_PASSWORD en el archivo .env}
    ports:
      - "8080:8080"
    volumes:
      - ./realm-config:/opt/keycloak/data/import
    command: 
      - start-dev
      - --import-realm


  db:
    image: mysql:8.0
    container_name: mysql_m7_pagos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_seguro
      MYSQL_DATABASE: m7_pagos
      MYSQL_USER: backend_user
      MYSQL_PASSWORD: backend_password
    ports:
      - "3306:3306" # Permite que MySQL Workbench se conecte desde tu máquina física
    volumes:
      - db_data:/var/lib/mysql # Persistencia de datos
      - ./init-db:/docker-entrypoint-initdb.d # Ejecuta el script al iniciar por primera vez

volumes:
  db_data:

