[project]
name = "m7-tarifas-pagos-liquidaciones"
version = "0.2.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: errores básicos, I: orden de imports, B: bugs comunes, UP: sintaxis moderna, S: seguridad
select = ["E", "F", "I", "B", "UP", "S"]
# B008: FastAPI usa Depends()/Header() como valor por defecto
# UP017/UP042: se mantiene el estilo actual (timezone.utc y enums str, Enum)
ignore = ["B008", "UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
# assert y valores fijos de prueba son esperables en los tests
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Un único comando corre unitarias e integración y exige 80 % de cobertura sobre app/
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    # Avisos de Starlette/FastAPI en Python 3.14; no afectan a 3.11
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.coverage.run]
branch = false
source = ["app"]
