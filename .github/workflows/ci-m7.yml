name: CI M7

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Compilar y ejecutar pruebas
        run: |
          python -m compileall -q backend
          python -m pytest -q

      - name: Construir imagen
        run: docker build -f backend/Dockerfile -t m7-grupo11 .

      - name: Entrar a GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'FRRe-DS/2026-11-TPI'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'FRRe-DS/2026-11-TPI'
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}/m7-grupo11"
          docker tag m7-grupo11 "${image}:${GITHUB_SHA}"
          docker tag m7-grupo11 "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
