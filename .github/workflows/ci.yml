name: CI

on:
  push:
  pull_request:

jobs:
  lint-y-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: m7_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d m7_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/m7_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (ruff)
        run: ruff format --check .

      - name: Tests unitarios, de integración y cobertura
        run: pytest --cov-report=xml

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: backend/coverage.xml

  imagen:
    runs-on: ubuntu-latest
    needs: lint-y-tests
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen de la API
        run: docker build -t m7-tarifas-api:${{ github.sha }} backend
